<script>
(function(){
'use strict';
const h = React.createElement;
const { useState, useEffect, useRef, useMemo } = React;
const cls = (...a)=>a.filter(Boolean).join(' ');
const fmt = (n)=>{ const x=Number(n)||0; return x.toLocaleString('th-TH',{maximumFractionDigits:2}); };

// ==================== STORAGE ====================
const KEY = 'weighing_v1';
// 🆕 Tolerance auto: <10→±0.5 · <100→±2 · <300→±5 · <500→±7 · <1000→±12 · ≥1000→±13
const calcTol = g => g<10?0.5 : g<100?2 : g<300?5 : g<500?7 : g<1000?12 : 13;
const mkItem = (name, target) => ({ name, target, unit:'g', tol:calcTol(target) });
// 🆕 Base recipes (seed ครั้งแรก) — แก้/เพิ่มได้ในแท็บ "สูตร"
// __SEED_START__  (อย่าลบคอมเมนต์นี้ — ใช้เป็น marker ตอน "บันทึกสูตรลงไฟล์")
const SEED_RECIPES = [
  { id:'r_seed1', name:'แป้งเกลือ', items:[
    mkItem('เกลือ',24), mkItem('ผงนิ่ม',18), mkItem('นมผง',90),
    mkItem('น้ำตาล',180), mkItem('แป้ง X-1',1680) ] },
  { id:'r_seed2', name:'แป้งโลฟ', items:[
    mkItem('สาร',10), mkItem('ผงนิ่ม',17), mkItem('เกลือ',21),
    mkItem('วานิลลา',34), mkItem('นมผง',155), mkItem('น้ำตาล',250),
    mkItem('แป้งวีนัส',2250) ] },
  { id:'r_seed3', name:'ขนมปัง', items:[
    mkItem('สาร',10), mkItem('ผงนิ่ม',27), mkItem('เกลือ',21),
    mkItem('วานิลลา',34), mkItem('นมผง',155), mkItem('น้ำตาล',300),
    mkItem('แป้งเค้ก',200), mkItem('แป้งวีนัส',2050) ] },
  { id:'r_seed4', name:'ขนมปัง V.2', items:[
    mkItem('สาร',7), mkItem('ผงนิ่ม',12), mkItem('เกลือ',15),
    mkItem('นมผง',90), mkItem('น้ำตาล',200), mkItem('แป้งเค้ก',110),
    mkItem('แป้ง X-1',1600) ] },
  { id:'r_seed5', name:'แป้งขนมปังหน้าสาขา V.2', items:[
    mkItem('สาร',5), mkItem('เกลือ',15), mkItem('นมผง',100),
    mkItem('น้ำตาล',240), mkItem('แป้งเค้ก',64), mkItem('แป้ง X-1',1656) ] },
  { id:'r_seed6', name:'โลฟพรีเมี่ยม', items:[
    mkItem('แป้ง X-1',1900), mkItem('เกลือ',18), mkItem('นมผง',120),
    mkItem('ผงนิ่ม',10), mkItem('แป้งเค้ก',100), mkItem('น้ำตาล',240),
    mkItem('สาร',5) ] },
]; // __SEED_END__  (อย่าลบคอมเมนต์นี้)
const loadState = () => {
  try { const s = JSON.parse(localStorage.getItem(KEY)||'{}');
    // 🆕 ถ้ายังไม่มีสูตร → seed 6 สูตร Base เสมอ (กัน localStorage ค้าง)
    if(!s.recipes || s.recipes.length===0){
      const seeded = { recipes: JSON.parse(JSON.stringify(SEED_RECIPES)),
        logs: s.logs||[], settings: settingsWithDefaults(s.settings) };
      saveState(seeded);
      return seeded;
    }
    return { recipes: s.recipes, logs: s.logs||[], settings: settingsWithDefaults(s.settings) };
  } catch(e){ return { recipes: JSON.parse(JSON.stringify(SEED_RECIPES)), logs:[], settings: settingsWithDefaults({}) }; }
};
let _quotaWarned = false;
const saveState = (s) => {
  try { localStorage.setItem(KEY, JSON.stringify(s)); }
  catch(e){
    // เดิมกลืนเงียบ → พื้นที่เต็ม/เขียนไม่ได้ = ประวัติหายโดยไม่มีใครรู้
    if(!_quotaWarned){ _quotaWarned = true;
      alert('⚠️ บันทึกลงเครื่องไม่ได้ (' + (e && e.name || 'error') + ')\nประวัติการชั่งรอบนี้อาจไม่ถูกเก็บ — ไปที่ ตั้งค่า → Export ข้อมูล แล้วแจ้งผู้ดูแล'); }
  }
};
// ขอให้เบราว์เซอร์ไม่ล้างข้อมูลหน้านี้เองตอนพื้นที่ตึง (Chrome Android ให้เมื่อใช้งานบ่อย/เพิ่มไปหน้าจอหลัก)
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
// 🆕 ชุดที่กำลังชั่ง (session) เก็บแยก — refresh/เผลอสลับแท็บ/จอดับ แล้วกลับมาชั่งต่อได้ ไม่ต้องเริ่มใหม่
const SESSION_KEY = KEY + '__session';
const loadSession = () => { try { return JSON.parse(localStorage.getItem(SESSION_KEY)||'null') || null; } catch(e){ return null; } };
const saveSession = (x) => { try { x ? localStorage.setItem(SESSION_KEY, JSON.stringify(x)) : localStorage.removeItem(SESSION_KEY); } catch(e){} };
// รหัสเครื่อง 2 ตัว (ใช้ต่อท้ายเลข LOT กันชนกันระหว่างแท็บเล็ตหลายจุด)
const getDeviceId = () => {
  try {
    let id = localStorage.getItem(KEY + '__device');
    if(!id){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; id = A[Math.floor(Math.random()*A.length)] + A[Math.floor(Math.random()*A.length)];
      localStorage.setItem(KEY + '__device', id); }
    return id;
  } catch(e){ return 'XX'; }
};
const LOG_CAP = 3000;   // เดิม 200 = ครัวกลางอยู่ได้ไม่ถึงสัปดาห์แล้วประวัติเก่าหายเงียบ
// แปลงเป็นกรัม: kg/L ×1000 · ml/g ×1 (ของเหลวตวงเป็นกรัม 1 มล. ≈ 1 ก.) · หน่วยอื่นใช้ตัวเลขตรง ๆ
const toGrams = (v, unit) => { const n = Number(v)||0; return (unit==='kg'||unit==='L') ? n*1000 : n; };
const WEIGH_UNITS = ['g','kg','ml','L'];
// เปิดปุ่มทดสอบ (Mock/Serial บนมือถือ) ด้วย ?debug=1
const DEBUG = /[?&]debug=1/.test(location.search);
// 🆕 มือถือ/แท็บเล็ต: หน้าจอพิมพ์ของ Android/iOS ไปไม่ถึงเครื่องพิมพ์บลูทูธ/USB → ค่าเริ่มต้นไม่เด้งพิมพ์อัตโนมัติ
//    (บันทึกประวัติตามปกติ · เปิดพิมพ์อัตโนมัติได้เองใน ตั้งค่า ถ้าจุดนั้นมีเครื่องพิมพ์ที่ระบบมองเห็น)
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '')
  || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent || ''));  // iPadOS แสดงตัวเป็น Mac
const settingsWithDefaults = (st) => {
  const x = { ...(st||{}) };
  if(x.autoPrint === undefined && IS_MOBILE) x.autoPrint = false;
  return x;
};

// ==================== SCALE PARSER (reuse from ERP) ====================
function parseScaleLine(line, unitHint){
  if(!line) return null;
  const trimmed = line.trim();
  let stable = null;
  if(/^ST/i.test(trimmed)) stable = true;
  else if(/^US/i.test(trimmed)) stable = false;
  else if(/^OL/i.test(trimmed)) return { weight: 999999, stable:false, overload:true };
  else if(/\bS\s+S\b/.test(trimmed)) stable = true;
  else if(/\bS\s+D\b/.test(trimmed)) stable = false;
  const m = trimmed.match(/[+-]?\s*[\d,]+\.?\d*/);
  if(!m) return null;
  const numStr = m[0].replace(/[\s,]/g,'');
  const weight = parseFloat(numStr);
  if(isNaN(weight)) return null;
  let isKg;
  if(unitHint === 'kg') isKg = true;
  else if(unitHint === 'g') isKg = false;
  else isKg = /\bkg\b/i.test(trimmed) && !/\bg\b/i.test(trimmed);
  const grams = isKg ? weight * 1000 : weight;
  return { weight: Number(grams.toFixed(2)), stable, raw: trimmed };
}

// ==================== SCALE CONNECTOR HOOK ====================
function useScale(){
  const [connected, setConnected] = useState(false);
  const [device, setDevice] = useState(null);
  const [liveWeight, setLiveWeight] = useState(null);  // grams
  const [stable, setStable] = useState(false);
  const [mode, setMode] = useState(null);
  const [rawLog, setRawLog] = useState([]);
  const [baudRate, setBaudRate] = useState(9600);
  const portRef = useRef(null), readerRef = useRef(null), cleanupRef = useRef(null), stableT = useRef(null);
  const appendLog = (l)=>setRawLog(p=>[...p.slice(-14), l]);
  // 🆕 เวลาแพ็กเก็ตล่าสุด — ใช้จับ "สัญญาณค้าง" (เครื่องหยุดส่งเงียบ ๆ โดยไม่หลุด) ไม่ให้ล็อกค่าค้าง
  const lastPacketRef = useRef(0);
  // 🆕 ตัวตัดสิน "นิ่ง" จุดเดียว ใช้ทั้ง Serial และ BLE
  //    เดิม: ค่าเปลี่ยน → setStable(false) แล้วบรรทัดถัดไปเห็นธง ST → setStable(true) ในแพ็กเก็ตเดียวกัน
  //    React รวมเป็นรอบเดียว → เครื่องที่ส่ง ST ทุกบรรทัด (มีหลายรุ่น) จะ "นิ่ง" ตลอดแม้กำลังเทอยู่
  //    ใหม่: แพ็กเก็ตที่ค่าเปลี่ยน = ไม่นิ่งเสมอ · ธง ST มีผลเฉพาะแพ็กเก็ตถัดไปที่ค่าไม่ขยับ
  const mkStableJudge = () => {
    let lastW = null, st = null;
    return (parsed) => {
      lastPacketRef.current = Date.now();
      const changed = lastW != null && Math.abs(lastW - parsed.weight) > 0.5;
      lastW = parsed.weight; setLiveWeight(parsed.weight);
      if(changed || lastW == null){
        setStable(false);
        if(st){ clearTimeout(st); st = null; }
        // เผื่อเครื่องที่ส่งเฉพาะตอนค่าเปลี่ยน — ถ้าเงียบไป 2 วิ ถือว่านิ่ง
        st = setTimeout(()=>{ st = null; setStable(true); }, 2000);
        return;
      }
      if(parsed.stable === true){ if(st){ clearTimeout(st); st = null; } setStable(true); }
      else if(parsed.stable === false){ setStable(false); if(st){ clearTimeout(st); st = null; } }
      else if(!st) st = setTimeout(()=>{ st = null; setStable(true); }, 2000);
    };
  };

  const connectMock = () => {
    setMode('mock'); setDevice({ name:'🎭 Mock Scale' }); setConnected(true);
    let cur=0, target=500+Math.random()*100, phase='rising';
    const tick=()=>{
      if(phase==='rising'){ cur+=30+Math.random()*40; if(cur>=target){cur=target;phase='stable';} setStable(false); }
      else { cur=target+(Math.random()-0.5)*2; if(!stableT.current) stableT.current=setTimeout(()=>setStable(true),2000); }
      lastPacketRef.current = Date.now();
      setLiveWeight(Number(cur.toFixed(1)));
    };
    const iv=setInterval(tick,300);
    cleanupRef.current=()=>{ clearInterval(iv); clearTimeout(stableT.current); stableT.current=null; };
  };

  const connectSerial = async (baud) => {
    if(!navigator.serial){ alert('❌ Browser ไม่รองรับ Web Serial\n→ ใช้ Chrome/Edge บน PC/Mac'); return; }
    try {
      const port = await navigator.serial.requestPort();
      await port.open({ baudRate:Number(baud)||9600, dataBits:8, stopBits:1, parity:'none' });
      portRef.current = port;
      setMode('serial'); setDevice({ name:'🔌 Serial USB' }); setConnected(true);
      const reader = port.readable.getReader(); readerRef.current = reader;
      let buffer='';
      const judge = mkStableJudge();
      const loop = async () => {
        try {
          while(true){
            const { value, done } = await reader.read();
            if(done) break;
            buffer += new TextDecoder().decode(value);
            const lines = buffer.split(/[\r\n]+/); buffer = lines.pop()||'';
            for(const ln of lines){
              if(!ln.trim()) continue;
              appendLog(ln);
              const p = parseScaleLine(ln);
              if(p!=null) judge(p);
            }
          }
        } catch(e){ appendLog('read error: '+e.message); }
      };
      loop();
      cleanupRef.current = async()=>{ try{ await reader.cancel(); reader.releaseLock(); await port.close(); }catch{} };
    } catch(e){ if(e.name!=='NotFoundError') alert('❌ Serial: '+e.message); }
  };

  // ---------- BLE ----------
  // 🆕 แยก "เลือกเครื่อง" ออกจาก "ต่อ+สมัครรับค่า" เพื่อให้ต่อใหม่อัตโนมัติได้เมื่อเครื่องชั่งดับเอง
  //    (เครื่องชั่ง BLE ราคาถูกส่วนใหญ่ปิดเองเมื่อนิ่ง 2-3 นาที — เดิมต้องกดเลือกเครื่องใหม่ทุกครั้ง)
  const [connecting, setConnecting] = useState('');   // ข้อความสถานะระหว่างต่อ ('' = ไม่ได้ต่ออยู่)
  const devRef = useRef(null);
  const onDropRef = useRef(null);   // callback ให้หน้าชั่งรู้ว่าสัญญาณหลุดกลางคัน
  const reconnectingRef = useRef(false);

  const attachBLE = async (dev, label) => {
    let server = null;
    for(let attempt=1; attempt<=4; attempt++){
      try {
        setConnecting(`${label||'กำลังเชื่อมต่อ'}… (ครั้งที่ ${attempt}/4)`);
        appendLog(`⏳ GATT connect... (ครั้งที่ ${attempt}/4)`);
        server = await dev.gatt.connect();
        if(server && server.connected){ appendLog('✅ GATT connected'); break; }
      } catch(err){
        appendLog(`⚠️ ครั้งที่ ${attempt} ล้ม: ${err.message}`);
        if(attempt < 4){
          await new Promise(r=>setTimeout(r, 600*attempt));  // backoff 0.6/1.2/1.8s
          try{ dev.gatt.disconnect(); }catch{}
        } else {
          throw new Error(`เชื่อมเครื่องชั่งไม่ได้ (ลอง 4 ครั้ง) — ${err.message}\n\n💡 ลอง:\n• เปิดเครื่องชั่ง + วางใกล้แท็บเล็ต + เช็คแบต\n• ปิด-เปิด Bluetooth\n• ถ้าเคยจับคู่ไว้ในตั้งค่าเครื่อง ให้ลบการจับคู่ออกแล้วต่อผ่านหน้านี้อย่างเดียว`);
        }
      }
    }
    if(!server) throw new Error('GATT connect ไม่สำเร็จ');
    setConnecting('กำลังค้นหาสัญญาณน้ำหนัก…');
    const services = await server.getPrimaryServices();
    let nc=null;
    const std = services.find(s=>s.uuid.toLowerCase().includes('0000181d'));
    if(std){ try{ const cs=await std.getCharacteristics(); const w=cs.find(c=>c.uuid.toLowerCase().includes('00002a9d')); if(w&&w.properties.notify) nc=w; }catch{} }
    if(!nc){ for(const s of services){ try{ const cs=await s.getCharacteristics(); for(const c of cs){ if(c.properties.notify||c.properties.indicate){ nc=c; break; } } if(nc) break; }catch{} } }
    if(!nc) throw new Error('ไม่พบสัญญาณน้ำหนักจากเครื่องนี้ — อาจเลือกผิดเครื่อง หรือเครื่องชั่งรุ่นนี้ไม่รองรับ Web Bluetooth');
    const judge = mkStableJudge();
    const onVal = (ev)=>{
      const dv=ev.target.value; const b=[];
      for(let i=0;i<dv.byteLength;i++) b.push(dv.getUint8(i).toString(16).padStart(2,'0'));
      appendLog(b.join(' '));
      let parsed=null;
      if(dv.byteLength>=3 && nc.uuid.toLowerCase().includes('00002a9d')){
        const fl=dv.getUint8(0), raw=dv.getUint16(1,true);
        parsed={ weight:Number(((fl&1?raw*0.01*0.453592:raw*0.005)*1000).toFixed(1)), stable:true };
      } else {
        const t=new TextDecoder().decode(dv); const pp=parseScaleLine(t);
        if(pp) parsed=pp; else { const mm=t.match(/([+-]?\d+\.?\d*)/); if(mm){ const v=parseFloat(mm[1]); parsed={ weight:/kg/i.test(t)?v*1000:v, stable:/ST|stable/i.test(t) }; } }
        if(!parsed && dv.byteLength>=2) parsed={ weight:dv.getUint16(0,true), stable:true };
      }
      if(parsed) judge(parsed);
    };
    await nc.startNotifications();
    nc.addEventListener('characteristicvaluechanged', onVal);
    appendLog('✅ subscribed');
    cleanupRef.current=async()=>{ try{ nc.removeEventListener('characteristicvaluechanged',onVal); await nc.stopNotifications(); dev.gatt.disconnect(); }catch{} };
    setMode('bluetooth'); setDevice({ name:dev.name||'BLE' }); setConnected(true); setConnecting('');
  };

  const connectBLE = async () => {
    if(!navigator.bluetooth){ alert('❌ เบราว์เซอร์นี้ไม่รองรับ Web Bluetooth — ใช้ Chrome บน Android / คอม'); return; }
    if(connecting) return;   // กันกดซ้ำระหว่างรอ
    try {
      setConnecting('เลือกเครื่องชั่งจากรายการ…');
      // รายการ service เดียวกับใน ERP (เครื่องชั่งของร้านต่อผ่านรายการนี้สำเร็จแล้ว)
      const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices:true,
        optionalServices:[0x181D,0x181B,0x1810,0xFFE0,0xFFF0,0xFFB0,0xFEE7,
          '0000fff0-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb',
          '0000ffb0-0000-1000-8000-00805f9b34fb',
          '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
          '49535343-fe7d-4ae5-8fa9-9fafd205e455'] });
      appendLog('🔵 '+(dev.name||dev.id));
      devRef.current = dev;
      // หลุด → แจ้งหน้าชั่ง + พยายามต่อใหม่เองจากเครื่องเดิม (ไม่ต้องเลือกใหม่)
      dev.addEventListener('gattserverdisconnected', async ()=>{
        if(devRef.current !== dev) return;   // ผู้ใช้กด "ตัด" เอง / เปลี่ยนเครื่องแล้ว
        setConnected(false); setLiveWeight(null); setStable(false);
        try{ onDropRef.current && onDropRef.current(); }catch(e){}
        if(reconnectingRef.current) return;
        reconnectingRef.current = true;
        try {
          for(let i=1;i<=3;i++){
            if(devRef.current !== dev) return;
            await new Promise(r=>setTimeout(r, 1500*i));
            try { await attachBLE(dev, `สัญญาณหลุด — ต่อใหม่อัตโนมัติ`); return; }
            catch(e){ appendLog('↻ ต่อใหม่ล้ม: '+e.message); }
          }
          // ต่อใหม่ไม่ได้ → ปล่อยให้ผู้ใช้กดต่อเอง (เครื่องชั่งอาจปิดจริง)
          setDevice(null); setMode(null); setConnecting('');
        } finally { reconnectingRef.current = false; }
      });
      await attachBLE(dev, 'กำลังเชื่อมต่อ ' + (dev.name||''));
    } catch(e){
      setConnecting('');
      if(e.name!=='NotFoundError') alert('❌ ' + e.message
        + (IS_MOBILE ? '\n\n💡 บน Android: เปิด Bluetooth + เปิด "ตำแหน่ง (Location)" ด้วย ไม่งั้นรายการเครื่องจะว่าง · ใช้ Chrome ตัวจริง (ไม่ใช่เบราว์เซอร์ในแอปแชท)' : ''));
    }
  };

  const disconnect=()=>{ devRef.current = null; if(cleanupRef.current) try{cleanupRef.current();}catch{} cleanupRef.current=null;
    setConnected(false); setDevice(null); setLiveWeight(null); setStable(false); setMode(null); setRawLog([]); setConnecting(''); };
  // (เดิมมีปุ่ม Tare ในแอปที่แค่เขียนค่า 0 ทับบนจอ ไม่ได้สั่งเครื่อง → เปิด zero-gate ผิดได้ทั้งที่มีของบนเครื่อง — ถอดออกแล้ว)

  // 🆕 กันจอดับตอนต่อเครื่องชั่งอยู่ (แท็บเล็ต/มือถือหน้างาน) — ปล่อยเองเมื่อตัดการเชื่อมต่อ
  useEffect(()=>{
    if(!connected || !navigator.wakeLock) return;
    let lock = null, alive = true;
    const grab = async()=>{
      if(lock && !lock.released) return;
      try {
        const l = await navigator.wakeLock.request('screen');
        if(!alive){ try{ l.release(); }catch(e){} return; }   // ตัดการเชื่อมต่อไปก่อนที่ระบบจะให้ lock
        lock = l;
      } catch(e){}
    };
    grab();
    const onVis = ()=>{ if(alive && document.visibilityState==='visible') grab(); };
    document.addEventListener('visibilitychange', onVis);
    return ()=>{ alive=false; document.removeEventListener('visibilitychange', onVis); try{ lock && lock.release(); }catch(e){} };
  }, [connected]);

  // อายุของแพ็กเก็ตล่าสุด (ms) — ให้หน้าชั่งตัดสินว่าสัญญาณค้างไหม
  const packetAge = () => lastPacketRef.current ? (Date.now() - lastPacketRef.current) : Infinity;
  return { connected, connecting, device, liveWeight, stable, mode, rawLog, baudRate, setBaudRate,
    connectMock, connectSerial, connectBLE, disconnect, packetAge, onDropRef };
}

// ==================== LABEL (100x75mm — แนวนอน) ====================
// rotate: false = @page 100×75 ตรง · true = หมุนเนื้อหา 90° (กล่อง 75×100 เข้ากรอบ 100×75)
function buildLabel(data, copies, rotate){
  const d = data.ts ? new Date(data.ts) : new Date();
  const dateStr = d.toLocaleDateString('th-TH',{ day:'2-digit', month:'2-digit', year:'numeric' });
  const timeStr = d.toLocaleTimeString('th-TH',{ hour:'2-digit', minute:'2-digit' });
  // 🆕 ไม่แสดงรายการ — เน้นน้ำหนักรวมใหญ่ · เพิ่มวันที่ผลิต · เนื้อหาพอดี 100×75 (แนวนอน)
  const inner = `
    <div class="lbl">
      <div style="font-size:12pt;font-weight:bold;text-align:center;border-bottom:1px solid #000;padding-bottom:0.8mm;margin-bottom:1mm;white-space:nowrap;overflow:hidden">${data.recipeName||''}</div>
      <div style="display:flex;justify-content:space-between;font-size:7.5pt;margin-bottom:0.3mm">
        <span>📅 <b>${dateStr}</b></span><span>${timeStr} น.</span>
      </div>
      <div style="font-size:7pt;margin-bottom:0.8mm">LOT: <b>${data.lot||'-'}</b></div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.5mm;text-align:center">
        <div style="font-size:8pt;color:#444">น้ำหนักรวม</div>
        <div style="font-size:30pt;font-weight:bold;line-height:1">${fmt(data.total||0)}<span style="font-size:11pt;font-weight:bold;color:#333"> ก.</span></div>
      </div>
      <div style="padding-top:0.8mm;border-top:1px solid #999;font-size:7pt;color:#444;text-align:center;white-space:nowrap;overflow:hidden">
        ผู้ชั่ง: ${data.operator||'-'}${data.note?' · '+data.note:''}
      </div>
    </div>`;
  // 🆕 2 โหมด — ดวง 100×75 แนวนอน · ใช้ wrapper + absolute positioning ให้ robust
  //   rotate=false → content ตรง (100×75) · rotate=true → หมุนเนื้อหา 90° (กล่อง 75×100 → กรอบ 100×75)
  let pageCss, bodyInner;
  if(rotate){
    // physical page = 100×75 · content .lbl เป็น 75×100 (สลับ W/H) หมุน 90° แล้วเลื่อนเข้ากรอบ
    //   translate(100mm,0) rotate(90°): มุมซ้ายบนของกล่องไปอยู่มุมขวาบนของหน้า → กางลงพอดี 100×75
    pageCss = `@page { size:100mm 75mm; margin:0; }
      html,body { margin:0; padding:0; width:100mm; }
      .wrap { position:relative; width:100mm; height:75mm; overflow:hidden;
              page-break-after:always; }
      .lbl  { position:absolute; top:0; left:0;
              width:75mm; height:100mm; box-sizing:border-box; padding:2.5mm;
              display:flex; flex-direction:column;
              transform-origin: top left;
              transform: translate(100mm, 0) rotate(90deg); }`;
    bodyInner = Array.from({length:copies||1})
      .map(()=>`<div class="wrap">${inner}</div>`).join('');
  } else {
    pageCss = `@page { size:100mm 75mm; margin:0; }
      html,body { margin:0; padding:0; }
      .lbl { width:100mm; height:75mm; box-sizing:border-box; padding:2.5mm;
             display:flex; flex-direction:column; page-break-after:always; }`;
    bodyInner = Array.from({length:copies||1}).map(()=>inner).join('');
  }
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Label ${data.lot}</title>
<style>
  ${pageCss}
  body { font-family:-apple-system,'Sarabun',sans-serif; }
  @media print { body{-webkit-print-color-adjust:exact;print-color-adjust:exact;} }
</style></head><body>
${bodyInner}
<script>window.onload=()=>{setTimeout(()=>{window.print();},250);};<\/script>
</body></html>`;
}

// 🆕 พิมพ์ผ่าน hidden iframe — ไม่ต้องขอ popup · ใช้ได้กับ timer (auto-finish)
function printHTML(html){
  try {
    let f = document.getElementById('__printFrame');
    if(f) f.remove();
    f = document.createElement('iframe');
    f.id = '__printFrame';
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
    document.body.appendChild(f);
    const doc = f.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    f.onload = () => { setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} }, 300); };
    return true;
  } catch(err){
    const w = window.open('','_blank','width=420,height=620');
    if(!w){ alert('⚠️ พิมพ์ไม่ได้: '+err.message); return false; }
    w.document.write(html); w.document.close();
    return true;
  }
}

// ==================== USB LABEL PRINTER (WebUSB → TSPL / ESC-POS raster) ====================
// แท็บเล็ต Android: หน้าจอพิมพ์ของระบบไปไม่ถึงเครื่องพิมพ์ USB/บลูทูธ → แอปวาดฉลากเป็นรูปขาวดำแล้วส่งเข้าเครื่องพิมพ์เอง
// ผ่าน WebUSB (Chrome Android รองรับ · เสียบผ่านสาย/hub OTG) · ภาษาเครื่องพิมพ์: TSPL (เครื่องฉลาก) หรือ ESC/POS (เครื่องใบเสร็จ)
const _C128 = [
  '212222','222122','222221','121223','121322','131222','122213','122312','132212','221213',
  '221312','231212','112232','122132','122231','113222','123122','123221','223211','221132',
  '221231','213212','223112','312131','311222','321122','321221','312212','322112','322211',
  '212123','212321','232121','111323','131123','131321','112313','132113','132311','211313',
  '231113','231311','112133','112331','132131','113123','113321','133121','313121','211331',
  '231131','213113','213311','213131','311123','311321','331121','312113','312311','332111',
  '314111','221411','431111','111224','111422','121124','121421','141122','141221','112214',
  '112412','122114','122411','142112','142211','241211','221114','413111','241112','134111',
  '111242','121142','121241','114212','124112','124211','411212','421112','421211','212141',
  '214121','412121','111143','111341','131141','114113','114311','411113','411311','113141',
  '114131','311141','411131','211412','211214','211232','2331112'];
// คืนลำดับความกว้างแท่ง/ช่องว่างของ Code128-B · คืน null ถ้ามีอักขระที่เข้ารหัสไม่ได้ (ห้ามตัดทิ้งเงียบ — สแกนได้คนละเลข)
function code128Widths(text){
  const raw = String(text == null ? '' : text);
  if(!raw || /[^\x20-\x7E]/.test(raw)) return null;
  const codes = [104];
  for(let i=0;i<raw.length;i++) codes.push(raw.charCodeAt(i)-32);
  let sum = 104; for(let i=1;i<codes.length;i++) sum += codes[i]*i;
  codes.push(sum % 103); codes.push(106);
  let out=''; for(const c of codes){ const pat=_C128[c]; if(!pat) return null; out+=pat; }
  return out;
}

const LABEL_PRESETS = [
  { id:'100x75', label:'100×75 มม.', w:100, h:75 },
  { id:'80x50',  label:'80×50 มม.',  w:80,  h:50 },
  { id:'100x50', label:'100×50 มม.', w:100, h:50 },
  { id:'50x30',  label:'50×30 มม.',  w:50,  h:30 },
];
const printerOpts = (settings) => {
  const p = (settings && settings.printer) || {};
  const preset = LABEL_PRESETS.find(x=>x.id===(p.size||'100x75')) || LABEL_PRESETS[0];
  return { lang: p.lang||'tspl', wmm: Number(p.wmm)||preset.w, hmm: Number(p.hmm)||preset.h,
    gapmm: p.gapmm!=null ? Number(p.gapmm) : 2, dpi: Number(p.dpi)||203, density: Number(p.density)||8,
    threshold: Number(p.threshold)||160, feedDots: p.feedDots!=null ? Number(p.feedDots) : 0 };
};

// วาดฉลากลง canvas ขนาดเท่าจุดพิมพ์จริง (203 dpi = 8 จุด/มม.) — ห้ามสเกลทีหลัง (ขอบตัวอักษรเบลอ → threshold แล้ววรรณยุกต์หาย)
function renderLabelCanvas(data, opt){
  const dpmm = (opt.dpi||203)/25.4;
  let W = Math.round(opt.wmm*dpmm); W -= W % 8;          // ความกว้างต้องหาร 8 ลงตัว (1 ไบต์ = 8 จุด)
  const H = Math.round(opt.hmm*dpmm);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);          // พื้นโปร่งใส = ดำทั้งดวง
  ctx.fillStyle = '#000'; ctx.textBaseline = 'top';
  const FONT = '"Sarabun","Noto Sans Thai","Leelawadee UI","Tahoma",sans-serif';
  const pad = Math.round(1.5*dpmm);
  const innerW = W - pad*2;
  // ตัดบรรทัดทีละอักขระ (ภาษาไทยไม่มีช่องว่างคั่นคำ) · คืน array บรรทัด
  const wrap = (txt, maxW, maxLines) => {
    const lines=[]; let cur='';
    // ถ้ามีช่องว่าง ให้ลองตัดที่ช่องว่างก่อน (เช่น "ขนมปัง V.2") ไม่งั้นตัดทีละอักขระ (ไทยไม่มีช่องว่างคั่นคำ)
    const words = String(txt||'').split(' ');
    const units = words.length > 1 ? words.flatMap((w,i)=> i<words.length-1 ? [w,' '] : [w]) : Array.from(String(txt||''));
    for(const ch of units){
      const t = cur+ch;
      if(ctx.measureText(t).width > maxW && cur.trim()){
        if(ctx.measureText(ch).width > maxW){   // คำเดียวยาวเกินบรรทัด → แตกทีละอักขระ
          for(const c2 of Array.from(ch)){ const t2=cur+c2; if(ctx.measureText(t2).width > maxW && cur){ lines.push(cur); cur=c2; if(lines.length>=maxLines) break; } else cur=t2; }
          if(lines.length>=maxLines) break;
        } else { lines.push(cur.trimEnd()); cur = ch===' ' ? '' : ch; if(lines.length>=maxLines) break; }
      } else cur = t;
    }
    cur = cur.trim();
    if(cur && lines.length<maxLines) lines.push(cur);
    if(lines.length>=maxLines && ctx.measureText(lines[maxLines-1]).width > maxW - 1) lines[maxLines-1] = lines[maxLines-1].slice(0,-1)+'…';
    return lines;
  };
  const setFont = (px, bold) => { ctx.font = (bold?'bold ':'') + Math.max(8,Math.round(px)) + 'px ' + FONT; };
  const line = (txt, px, bold, y, align) => {
    setFont(px, bold);
    const w = ctx.measureText(txt).width;
    const x = align==='center' ? (W-w)/2 : align==='right' ? W-pad-w : pad;
    ctx.fillText(txt, x, y);
    return y + px*1.25;
  };
  const d = data.ts ? new Date(data.ts) : new Date();
  const dateStr = d.toLocaleDateString('th-TH',{ day:'2-digit', month:'2-digit', year:'numeric' });
  const timeStr = d.toLocaleTimeString('th-TH',{ hour:'2-digit', minute:'2-digit' });
  const small = H < 300;                                      // ดวง 50×30 (240 จุด) — ย่อทุกอย่าง
  // 1) ชื่อสูตร (ใหญ่ หนา ≤2 บรรทัด) — เว้นหัวดวงเพิ่ม ไม่งั้นวรรณยุกต์ไทยบรรทัดแรกโดนตัด
  const nameFs = Math.round(H * (small ? 0.16 : 0.13));
  let y = pad + Math.round(nameFs*0.22);
  setFont(nameFs, true);
  const nameLines = wrap(data.recipeName||'', innerW, small ? 1 : 2);
  for(const ln of nameLines) y = line(ln, nameFs, true, y, 'center');
  ctx.fillRect(pad, Math.round(y), innerW, Math.max(2, Math.round(dpmm*0.25))); y += dpmm*0.8;
  // 2) วันที่ · เวลา · ผู้ชั่ง
  const infoFs = Math.round(H * (small ? 0.085 : 0.07));
  setFont(infoFs, false);
  const left = `${dateStr} ${timeStr} น.`;
  const right = data.operator ? `ผู้ชั่ง ${data.operator}` : '';
  ctx.fillText(left, pad, y);
  if(right){ const rw = ctx.measureText(right).width; ctx.fillText(right, W-pad-rw, y); }
  y += infoFs*1.3;
  // 3) LOT (โมโน หนา)
  const lotFs = Math.round(H * (small ? 0.10 : 0.085));
  ctx.font = 'bold ' + lotFs + 'px "Courier New",monospace';
  ctx.fillText('LOT ' + (data.lot||'-'), pad, y); y += lotFs*1.3;
  // 4) น้ำหนักรวม (ใหญ่สุด) · ปรับขนาดให้พอที่เหลือ
  const barcodeH = small ? 0 : Math.round(H*0.16);
  const footFs = Math.round(H * (small ? 0.075 : 0.06));
  const reserve = barcodeH + (barcodeH ? dpmm*2 : 0) + footFs*1.4 + pad;
  const avail = H - y - reserve;
  const wFs = Math.max(infoFs, Math.min(Math.round(H*0.34), Math.round(avail*0.85)));
  setFont(wFs, true);
  const wTxt = fmt(data.total||0);
  const unitFs = Math.round(wFs*0.4);
  const wW = ctx.measureText(wTxt).width; setFont(unitFs, true); const uW = ctx.measureText(' g').width;
  const wx = (W - wW - uW)/2; const wy = y + Math.max(0, (avail - wFs*1.1)/2);
  setFont(wFs, true); ctx.fillText(wTxt, wx, wy);
  setFont(unitFs, true); ctx.fillText(' g', wx + wW, wy + (wFs - unitFs)*0.9);
  y = wy + wFs*1.1 + dpmm;
  // 5) บาร์โค้ด LOT (เฉพาะเมื่อเป็น ASCII ล้วน — เข้ารหัส Code128 ได้ครบทุกตัว)
  if(barcodeH){
    const widths = code128Widths(data.lot||'');
    if(widths){
      const modules = widths.split('').reduce((a,b)=>a+Number(b),0);
      let mod = Math.floor((innerW - 20*2) / modules);        // quiet zone 10 module ต่อข้าง
      mod = Math.max(2, Math.min(4, mod));                      // ≥2 จุด (0.25 มม.) ถึงจะยิงติด
      if(mod*modules + 40 <= innerW){
        let x = Math.round((W - mod*modules)/2); let bar = true;
        for(const wch of widths){ const ww = Number(wch)*mod; if(bar) ctx.fillRect(x, Math.round(y), ww, barcodeH); x += ww; bar = !bar; }
        y += barcodeH + dpmm*0.5;
      }
    }
  }
  // 6) ท้ายดวง: นอกเกณฑ์ / หมายเหตุ
  setFont(footFs, !!data.offSpec);
  const foot = (data.offSpec ? '⚠ นอกเกณฑ์ ' : '') + (data.note || '');
  if(foot.trim()){ const fl = wrap(foot, innerW, 1)[0]||''; ctx.fillText(fl, pad, Math.min(y, H - footFs*1.2 - pad)); }
  return cv;
}

// canvas → บิตแมป 1 บิต (MSB = ซ้ายสุด) · ห้าม dither (ตัวไทย/บาร์โค้ดจะแตก) · blackIsOne: ESC/POS=true, TSPL=false
function canvasToBits(cv, threshold, blackIsOne){
  const W = cv.width, H = cv.height, rowBytes = W/8;
  const img = cv.getContext('2d').getImageData(0,0,W,H).data;
  const out = new Uint8Array(rowBytes*H);
  for(let yy=0; yy<H; yy++){
    for(let xx=0; xx<W; xx++){
      const i = (yy*W+xx)*4;
      const lum = 0.299*img[i] + 0.587*img[i+1] + 0.114*img[i+2];
      const black = img[i+3] > 127 && lum < threshold;
      const one = blackIsOne ? black : !black;
      if(one) out[yy*rowBytes + (xx>>3)] |= (0x80 >> (xx & 7));
    }
  }
  return out;
}
const _enc = new TextEncoder();
const _cat = (parts) => { const n = parts.reduce((a,p)=>a+p.length,0); const o = new Uint8Array(n); let k=0; for(const p of parts){ o.set(p,k); k+=p.length; } return o; };
// TSPL: SIZE/GAP/CLS/BITMAP/PRINT — BITMAP mode 0 · บิต 1 = ขาว
function buildTSPL(cv, opt, copies){
  const rowBytes = cv.width/8;
  const bits = canvasToBits(cv, opt.threshold, false);
  const head = `SIZE ${opt.wmm} mm,${opt.hmm} mm\r\nGAP ${opt.gapmm} mm,0\r\nDIRECTION 1,0\r\nDENSITY ${Math.max(0,Math.min(15,opt.density))}\r\nCLS\r\nBITMAP 0,0,${rowBytes},${cv.height},0,`;
  const tail = `\r\nPRINT 1,${Math.max(1,copies|0)}\r\n`;
  return _cat([_enc.encode(head), bits, _enc.encode(tail)]);
}
// ESC/POS: GS v 0 raster · บิต 1 = ดำ · ต่อดวงส่งซ้ำ (ไม่มีคำสั่ง copies) · จบด้วย FF ให้เครื่องฉลากเดินไปหัวดวงถัดไป
function buildESCPOS(cv, opt, copies){
  const rowBytes = cv.width/8, H = cv.height;
  const bits = canvasToBits(cv, opt.threshold, true);
  const hdr = new Uint8Array([0x1B,0x40, 0x1D,0x76,0x30,0x00, rowBytes&0xFF, (rowBytes>>8)&0xFF, H&0xFF, (H>>8)&0xFF]);
  const ff = new Uint8Array(opt.feedDots>0 ? [0x1B,0x4A,Math.min(255,opt.feedDots)] : [0x0C]);
  const one = _cat([hdr, bits, ff]);
  const parts=[]; for(let i=0;i<Math.max(1,copies|0);i++) parts.push(one);
  return _cat(parts);
}
// คำสั่งทดสอบแบบข้อความล้วน (ASCII) — ใช้เช็คว่า "สายถึงเครื่อง + ภาษาถูก" โดยยังไม่พึ่งการวาดรูป
function buildTestText(opt){
  if(opt.lang === 'escpos'){
    return _cat([_enc.encode('\x1B@\x1B!\x30YUME WEIGH TEST\n\x1B!\x00USB OK ' + new Date().toLocaleTimeString('th-TH') + '\n\n'), new Uint8Array([0x0C])]);
  }
  return _enc.encode(`SIZE ${opt.wmm} mm,${opt.hmm} mm\r\nGAP ${opt.gapmm} mm,0\r\nDIRECTION 1,0\r\nDENSITY ${opt.density}\r\nCLS\r\nTEXT 16,16,"3",0,1,1,"YUME WEIGH TEST"\r\nTEXT 16,60,"2",0,1,1,"USB OK ${new Date().toLocaleTimeString('th-TH')}"\r\nBARCODE 16,100,"128",${Math.round(opt.hmm*8*0.3)},1,0,2,2,"TEST-690912-01"\r\nPRINT 1,1\r\n`);
}

// hook: การเชื่อมต่อ WebUSB — จำอุปกรณ์ที่เคยอนุญาต (getDevices) ต่อใหม่เองตอนเปิดหน้า ไม่ต้องกดทุกครั้ง
function useUSBPrinter(){
  const [connected, setConnected] = useState(false);
  const [name, setName] = useState('');
  const [busy, setBusy] = useState('');
  const [lastErr, setLastErr] = useState('');
  const devRef = useRef(null), epRef = useRef(null), ifaceRef = useRef(null);
  const supported = typeof navigator !== 'undefined' && !!navigator.usb;

  const attach = async (dev) => {
    await dev.open();
    if(dev.configuration === null) await dev.selectConfiguration(1);
    let found = null;
    for(const iface of dev.configuration.interfaces){
      for(const alt of iface.alternates){
        const ep = alt.endpoints.find(e => e.direction==='out' && e.type==='bulk');
        if(!ep) continue;
        // เลือก interface class 7 (printer) ก่อน · ไม่มีก็เอา bulk OUT ตัวแรก
        if(!found || (alt.interfaceClass===7 && found.alt.interfaceClass!==7)) found = { iface, alt, ep };
      }
    }
    if(!found) throw new Error('ไม่พบช่องส่งข้อมูล (bulk OUT) ในอุปกรณ์นี้ — อาจเลือกผิดอุปกรณ์');
    try { await dev.claimInterface(found.iface.interfaceNumber); }
    catch(e){ throw new Error('จองช่องเครื่องพิมพ์ไม่ได้ (' + e.message + ') — ระบบ Android อาจจับเครื่องพิมพ์ไว้เอง: ถอดสายเสียบใหม่ / ปิดแอปเครื่องพิมพ์อื่นที่เปิดอยู่'); }
    if(found.alt.alternateSetting) try { await dev.selectAlternateInterface(found.iface.interfaceNumber, found.alt.alternateSetting); } catch(e){}
    devRef.current = dev; epRef.current = found.ep.endpointNumber; ifaceRef.current = found.iface.interfaceNumber;
    setName((dev.manufacturerName||'') + ' ' + (dev.productName||'USB Printer')); setConnected(true); setLastErr('');
  };
  const connect = async () => {
    if(!supported){ alert('❌ เบราว์เซอร์นี้ไม่รองรับ WebUSB — ใช้ Chrome บน Android/คอม (iPad/iPhone ใช้ไม่ได้)'); return; }
    setBusy('เลือกเครื่องพิมพ์…');
    try {
      let dev;
      try { dev = await navigator.usb.requestDevice({ filters:[{ classCode:7 }] }); }
      catch(e){ if(e.name==='NotFoundError'){ dev = await navigator.usb.requestDevice({ filters:[] }); } else throw e; }
      setBusy('กำลังเปิดเครื่องพิมพ์…');
      await attach(dev);
    } catch(e){
      if(e.name!=='NotFoundError'){ setLastErr(e.message); alert('❌ ' + e.message + '\n\n💡 เช็ค: เสียบสายผ่าน OTG/hub แน่นไหม · เครื่องพิมพ์เปิดอยู่ไหม · แท็บเล็ตรองรับ OTG ไหม'); }
    } finally { setBusy(''); }
  };
  // ต่อใหม่จากอุปกรณ์ที่เคยอนุญาตแล้ว (ไม่ต้องมี user gesture)
  const reconnect = async () => {
    if(!supported) return false;
    try {
      const list = await navigator.usb.getDevices();
      if(!list.length) return false;
      await attach(list[0]); return true;
    } catch(e){ setLastErr(e.message); return false; }
  };
  const disconnect = async () => {
    const d = devRef.current; devRef.current=null; epRef.current=null;
    try { if(d){ if(ifaceRef.current!=null) await d.releaseInterface(ifaceRef.current); await d.close(); } } catch(e){}
    setConnected(false); setName('');
  };
  useEffect(()=>{
    reconnect();
    if(!supported) return;
    const onDis = (ev)=>{ if(devRef.current && ev.device === devRef.current){ devRef.current=null; setConnected(false); setName(''); setLastErr('สายหลุด/เครื่องพิมพ์ปิด'); } };
    const onCon = ()=>{ if(!devRef.current) reconnect(); };
    navigator.usb.addEventListener('disconnect', onDis);
    navigator.usb.addEventListener('connect', onCon);
    return ()=>{ navigator.usb.removeEventListener('disconnect', onDis); navigator.usb.removeEventListener('connect', onCon); };
  }, []);
  const send = async (bytes) => {
    const dev = devRef.current, ep = epRef.current;
    if(!dev || ep==null) throw new Error('ยังไม่ได้ต่อเครื่องพิมพ์ USB');
    const CH = 16384;
    for(let i=0;i<bytes.length;i+=CH){
      const r = await dev.transferOut(ep, bytes.subarray(i, i+CH));
      if(r.status !== 'ok') throw new Error('ส่งข้อมูลไม่สำเร็จ (' + r.status + ')');
    }
  };
  const run = async (label, fn) => {
    if(busy) throw new Error('กำลังพิมพ์งานก่อนหน้าอยู่');
    setBusy(label);
    try { await fn(); setLastErr(''); }
    catch(e){ setLastErr(e.message); if(/disconnected|not found|NetworkError/i.test(e.message)){ devRef.current=null; setConnected(false); } throw e; }
    finally { setBusy(''); }
  };
  const printLabel = (data, settings, copies) => run('กำลังพิมพ์ฉลาก…', async () => {
    const opt = printerOpts(settings);
    const cv = renderLabelCanvas(data, opt);
    const job = opt.lang==='escpos' ? buildESCPOS(cv, opt, copies||1) : buildTSPL(cv, opt, copies||1);
    await send(job);
  });
  const testText = (settings) => run('พิมพ์ทดสอบ…', async () => { await send(buildTestText(printerOpts(settings))); });
  const testLabel = (settings) => printLabel({ recipeName:'ทดสอบพิมพ์ฉลาก ภาษาไทย', lot:'TEST-690912-01', total:2410.5, operator:'ทดสอบ', note:'พิมพ์ทดสอบ', ts:Date.now() }, settings, 1);
  return { supported, connected, name, busy, lastErr, connect, disconnect, printLabel, testText, testLabel };
}

// ==================== MAIN APP ====================
function App(){
  const [state, setState] = useState(loadState);
  const [tab, setTab] = useState('weigh');
  useEffect(()=>{ saveState(state); }, [state]);
  const update = (patch)=>setState(s=>({ ...s, ...patch }));
  // 🆕 เครื่องชั่งอยู่ระดับแอป — สลับไปดูสูตร/ประวัติแล้วกลับมา การเชื่อมต่อ+ชุดที่ชั่งอยู่ยังอยู่ครบ
  //    (เดิมอยู่ใน WeighTab ซึ่งถูก unmount ตอนสลับแท็บ → หลุดหมด + BLE ค้างเบื้องหลัง)
  const scale = useScale();
  const printer = useUSBPrinter();   // 🆕 เครื่องพิมพ์ USB (WebUSB) — อยู่ระดับแอปเช่นกัน

  // 🆕 สูตรที่ฝังในไฟล์ (SEED_RECIPES) เปลี่ยน (มี deploy ชุดใหม่) → รวมเข้าเครื่องแบบ "ตาม id"
  //    - id ใหม่ในไฟล์ → เพิ่ม · id เดิมแต่เนื้อหาต่าง → ใช้ของไฟล์ · สูตรที่เครื่องนี้สร้างเอง → คงไว้
  //    - ถามเฉพาะตอนสูตรในไฟล์เปลี่ยน ไม่ใช่ทุกครั้งที่เปิด · เขียนธง "เห็นแล้ว" หลังผู้ใช้ตอบ
  useEffect(()=>{
    try {
      const key = r => (r.items||[]).map(i=>[i.name,i.target,i.unit||'g',i.tol??''].join(':')).join('|');
      const sig = list => (list||[]).map(r=>r.id+'='+r.name+'='+key(r)).sort().join('||');
      const fileSig = sig(SEED_RECIPES);
      const SEEN_KEY = KEY + '__seedSig';
      let seen = null; try { seen = localStorage.getItem(SEEN_KEY); } catch(e){}
      if(SEED_RECIPES.length === 0 || seen === fileSig) return;
      const local = state.recipes || [];
      const byId = Object.fromEntries(local.map(r=>[r.id, r]));
      const added = SEED_RECIPES.filter(r => !byId[r.id]);
      const changed = SEED_RECIPES.filter(r => byId[r.id] && (byId[r.id].name+'='+key(byId[r.id])) !== (r.name+'='+key(r)));
      if(added.length === 0 && changed.length === 0){ try { localStorage.setItem(SEEN_KEY, fileSig); } catch(e){} return; }
      const msg = 'มีสูตรชุดใหม่จากส่วนกลาง\n\n'
        + (added.length ? '• เพิ่มใหม่ ' + added.length + ' สูตร: ' + added.map(r=>r.name).join(', ') + '\n' : '')
        + (changed.length ? '• ปรับปรุง ' + changed.length + ' สูตร: ' + changed.map(r=>r.name).join(', ') + '\n' : '')
        + '\nสูตรที่สร้างเองในเครื่องนี้จะยังอยู่ครบ\n\nกด OK = อัปเดตตอนนี้ · Cancel = ไว้ก่อน (จะถามอีกครั้งเมื่อเปิดหน้าใหม่)';
      if(window.confirm(msg)){
        const seedIds = new Set(SEED_RECIPES.map(r=>r.id));
        const merged = [
          ...SEED_RECIPES.map(r => JSON.parse(JSON.stringify(r))),
          ...local.filter(r => !seedIds.has(r.id)),
        ];
        setState(s => ({ ...s, recipes: merged }));
        try { localStorage.setItem(SEEN_KEY, fileSig); } catch(e){}
      }
    } catch(e){ console.warn('seed-merge failed', e); }
  }, []);  // รันครั้งเดียวตอนเปิด

  const TABS = [['weigh','⚖️ ชั่ง'],['recipes','📋 สูตร'],['logs','📜 ประวัติ'],['settings','⚙️ ตั้งค่า']];
  return h('div', { className:'min-h-screen' },
    // Header
    h('div', { className:'bg-gradient-to-r from-indigo-600 to-blue-600 text-white p-3 shadow-lg sticky top-0 z-20' },
      h('div', { className:'max-w-5xl mx-auto flex items-center justify-between flex-wrap gap-2' },
        h('div', null,
          h('div', { className:'font-bold text-lg' }, '⚖️ ระบบชั่งวัดตวง'),
          h('div', { className:'text-xs opacity-90' },
            scale.connected
              ? h('span', null, '🟢 ', scale.device?.name || 'เครื่องชั่ง', ' · ',
                  h('b', { className:'font-mono' }, scale.liveWeight!=null ? fmt(scale.liveWeight)+' g' : '—'),
                  printer.connected ? ' · 🖨️ USB' : '')
              : scale.connecting ? h('span', { className:'animate-pulse' }, '⏳ ', scale.connecting)
              : (IS_MOBILE ? 'ต่อเครื่องชั่งบลูทูธ · สูตร · ประวัติ' : 'สูตร + พิมพ์ Label อัตโนมัติ (100×75mm)'))),
        h('div', { className:'flex gap-1' },
          TABS.map(([k,lbl])=>
            h('button', { key:k, onClick:()=>setTab(k),
              className: cls('px-3 py-2 rounded text-sm font-medium',
                tab===k ? 'bg-white text-indigo-700' : 'bg-indigo-500/50 hover:bg-indigo-500') }, lbl))))),
    h('div', { className:'max-w-5xl mx-auto p-3' },
      // WeighTab ไม่ถูก unmount ตอนสลับแท็บ (ซ่อนแทน) → ชุดที่ชั่งอยู่ไม่หาย
      h('div', { hidden: tab!=='weigh' }, h(WeighTab, { state, update, scale, printer, visible: tab==='weigh' })),
      tab==='recipes'  && h(RecipesTab, { state, update }),
      tab==='logs'     && h(LogsTab, { state, printer }),
      tab==='settings' && h(SettingsTab, { state, update, printer }))
  );
}

// ==================== RECIPES TAB ====================
// 🆕 ฝังสูตรปัจจุบันลงไฟล์ HTML → ดาวน์โหลดไฟล์ใหม่ (เปิดเครื่องอื่นได้สูตรครบทันที)
//    เทคนิค: clone HTML ทั้งหน้า → reset #root → regex แทนบล็อก SEED_RECIPES ระหว่าง marker → download
//    ใช้ outerHTML (ไม่ fetch) → ทำงานได้แม้เปิดแบบ file://
function exportRecipesToHtml(recipes){
  try {
    // สร้าง JS literal ของสูตรปัจจุบัน (plain object — ไม่พึ่ง mkItem)
    const clean = (recipes||[]).map(r => ({
      id: r.id, name: r.name,
      items: (r.items||[]).map(it => ({ name:it.name, target:Number(it.target)||0,
        unit:it.unit||'g', tol:Number(it.tol)||0 })),
    }));
    const block = 'const SEED_RECIPES = ' + JSON.stringify(clean, null, 2) + ';';
    let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    // reset #root กลับเป็นข้อความโหลด (กันฝัง DOM ที่ render แล้วลงไฟล์)
    html = html.replace(/<div id="root">[\s\S]*?<\/div>\s*<script/, '<div id="root">กำลังโหลด...</div>\n<script');
    // แทนบล็อก SEED_RECIPES ระหว่าง marker
    // ⚠️ สร้างชื่อ marker ด้วยการต่อ string — กันไม่ให้โค้ดฟังก์ชันนี้มี literal marker
    //    (ไม่งั้น regex จะ match ได้ 2 ที่ → ไฟล์ที่ export แล้ว export ซ้ำจะพัง)
    const MK = '__SEED' + '_START__', ME = '__SEED' + '_END__';
    const re = new RegExp('// ' + MK + '[\\s\\S]*?// ' + ME + '[^\\n]*');
    if(!re.test(html)){ alert('❌ ไม่พบ marker สูตรในไฟล์ — export ไม่ได้'); return; }
    html = html.replace(re,
      '// ' + MK + '  (cmt)\n' + block + ' // ' + ME);
    const blob = new Blob([html], { type:'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url;
    a.download = 'weighing-' + (clean.length) + 'recipes-' +
      d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.html';
    a.click();
    URL.revokeObjectURL(url);
    alert('✅ บันทึก ' + clean.length + ' สูตรลงไฟล์ HTML แล้ว\n\nส่งไฟล์นี้ไปเครื่องอื่น เปิดปุ๊บมีสูตรครบทันที\n(ไฟล์เดิมของคุณไม่เปลี่ยน)');
  } catch(e){
    alert('❌ Export ไม่สำเร็จ: ' + e.message);
  }
}

function RecipesTab({ state, update }){
  const [editing, setEditing] = useState(null);  // recipe object or null
  const recipes = state.recipes || [];

  const newRecipe = () => setEditing({ id:'r_'+Date.now().toString(36), name:'', items:[
    { name:'', target:0, unit:'g', tol:0 }
  ]});
  const saveRecipe = (r) => {
    if(!r.name.trim()) return alert('ใส่ชื่อสูตร');
    const items = r.items.filter(it=>it.name.trim() && Number(it.target)>0)
      // 🆕 tol ว่าง/0 → ใช้ตารางมาตรฐาน (เดิมสูตรที่คีย์เองได้เกณฑ์คนละแบบกับสูตร seed และไม่โชว์ให้เห็น)
      .map(it => ({ ...it, name:it.name.trim(), unit: WEIGH_UNITS.includes(it.unit) ? it.unit : 'g',
        tol: Number(it.tol)>0 ? Number(it.tol) : calcTol(toGrams(it.target, it.unit)) }));
    if(items.length===0) return alert('ใส่วัตถุดิบอย่างน้อย 1 ตัว');
    const clean = { ...r, name:r.name.trim(), items };
    const exists = recipes.some(x=>x.id===r.id);
    update({ recipes: exists ? recipes.map(x=>x.id===r.id?clean:x) : [...recipes, clean] });
    setEditing(null);
  };
  const delRecipe = (id) => { if(confirm('ลบสูตรนี้?')) update({ recipes: recipes.filter(x=>x.id!==id) }); };

  if(editing){
    const r = editing;
    const setR = (patch)=>setEditing({ ...r, ...patch });
    const setItem = (i,patch)=>setR({ items: r.items.map((it,j)=>j===i?{...it,...patch}:it) });
    return h('div', { className:'bg-white rounded-lg shadow p-4 space-y-3' },
      h('h2', { className:'font-bold text-lg' }, recipes.some(x=>x.id===r.id)?'✏️ แก้สูตร':'➕ สูตรใหม่'),
      h('div', null,
        h('label', { className:'block text-sm font-medium mb-1' }, 'ชื่อสูตร *'),
        h('input', { type:'text', value:r.name, onChange:e=>setR({name:e.target.value}),
          placeholder:'เช่น แป้งเค้กสูตร A', autoFocus:true,
          className:'w-full px-3 py-2 border-2 rounded text-base' })),
      h('div', null,
        h('div', { className:'flex justify-between items-center mb-1' },
          h('label', { className:'text-sm font-medium' }, 'วัตถุดิบ (target + tolerance)'),
          h('button', { onClick:()=>setR({ items:[...r.items, {name:'',target:0,unit:'g',tol:0}] }),
            className:'text-xs px-2 py-1 bg-blue-100 hover:bg-blue-200 rounded' }, '+ เพิ่ม')),
        h('div', { className:'space-y-1' },
          r.items.map((it,i)=>h('div', { key:i, className:'flex gap-1 items-center bg-gray-50 rounded p-1.5' },
            h('span', { className:'text-xs text-gray-500 w-5 text-center' }, i+1),
            h('input', { type:'text', value:it.name, onChange:e=>setItem(i,{name:e.target.value}),
              placeholder:'ชื่อวัตถุดิบ', className:'flex-1 px-2 py-1 border rounded text-sm' }),
            h('input', { type:'number', value:it.target, step:'any', min:0,
              onChange:e=>setItem(i,{target:Number(e.target.value)||0}),
              placeholder:'target', className:'w-24 px-2 py-1 border rounded text-right text-sm' }),
            h('select', { value:it.unit, onChange:e=>setItem(i,{unit:e.target.value}),
              className:'px-1 py-1 border rounded text-xs' },
              WEIGH_UNITS.map(u=>h('option',{key:u,value:u},u))),
            h('span', { className:'text-xs text-gray-400' }, '±'),
            h('input', { type:'number', value:it.tol||'', step:'any', min:0,
              onChange:e=>setItem(i,{tol:Number(e.target.value)||0}),
              placeholder: 'อัตโนมัติ ' + calcTol(toGrams(it.target, it.unit)),
              title:'เว้นว่าง = ใช้ตารางมาตรฐาน: <10→±0.5 · <100→±2 · <300→±5 · <500→±7 · <1000→±12 · ≥1000→±13',
              className:'w-24 px-2 py-1 border rounded text-right text-sm' }),
            r.items.length>1 && h('button', { onClick:()=>setR({items:r.items.filter((_,j)=>j!==i)}),
              className:'text-red-500 px-1' }, '×'))))),
      h('div', { className:'flex gap-2 pt-2 border-t' },
        h('button', { onClick:()=>saveRecipe(r),
          className:'px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded font-medium' }, '💾 บันทึก'),
        h('button', { onClick:()=>setEditing(null),
          className:'px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded' }, 'ยกเลิก')));
  }

  // โหลดสูตรจากส่วนกลาง (ที่ฝังในไฟล์) — เพิ่มเฉพาะที่ยังไม่มี
  const loadBase = () => {
    if(recipes.length>0 && !confirm('โหลดสูตรจากส่วนกลาง ' + SEED_RECIPES.length + ' สูตร — จะเพิ่มเฉพาะที่ยังไม่มี (ของเดิมไม่หาย)\nกด OK เพื่อเพิ่ม'))
      return;
    const existIds = new Set(recipes.map(r=>r.id));
    const toAdd = SEED_RECIPES.filter(r=>!existIds.has(r.id))
      .map(r=>JSON.parse(JSON.stringify(r)));
    if(toAdd.length===0){ alert('สูตรจากส่วนกลางทั้ง ' + SEED_RECIPES.length + ' สูตร มีอยู่แล้ว'); return; }
    update({ recipes:[...recipes, ...toAdd] });
    alert(`✅ เพิ่ม ${toAdd.length} สูตรแล้ว`);
  };
  return h('div', { className:'space-y-3' },
    h('div', { className:'flex justify-between items-center flex-wrap gap-2' },
      h('h2', { className:'font-bold text-lg' }, '📋 สูตร (', recipes.length, ')'),
      h('div', { className:'flex gap-2 flex-wrap' },
        h('button', { onClick:loadBase,
          className:'px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-medium text-sm' },
          '📦 โหลดสูตรส่วนกลาง (' + SEED_RECIPES.length + ')'),
        recipes.length>0 && h('button', { onClick:()=>exportRecipesToHtml(recipes),
          title:'ดาวน์โหลดไฟล์ HTML ที่มีสูตรทั้งหมดฝังอยู่ — ส่งไปเครื่องอื่นเปิดได้เลย',
          className:'px-3 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded font-medium text-sm' },
          '💾 บันทึกสูตรลงไฟล์'),
        h('button', { onClick:newRecipe,
          className:'px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded font-medium' }, '➕ สูตรใหม่'))),
    recipes.length===0
      ? h('div', { className:'bg-white rounded-lg shadow p-8 text-center text-gray-500' },
          h('div', { className:'mb-2' }, 'ยังไม่มีสูตร'),
          h('button', { onClick:loadBase,
            className:'px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-bold' },
            '📦 โหลดสูตรส่วนกลาง ' + SEED_RECIPES.length + ' สูตร'))
      : h('div', { className:'grid gap-2 md:grid-cols-2' },
          recipes.map(r=>h('div', { key:r.id, className:'bg-white rounded-lg shadow p-3' },
            h('div', { className:'flex justify-between items-start' },
              h('div', null,
                h('div', { className:'font-bold' }, r.name),
                h('div', { className:'text-xs text-gray-500' }, r.items.length, ' วัตถุดิบ · รวม ',
                  fmt(r.items.reduce((s,it)=>s+toGrams(it.target, it.unit),0)), ' g')),
              h('div', { className:'flex gap-1' },
                h('button', { onClick:()=>setEditing(JSON.parse(JSON.stringify(r))),
                  className:'text-xs px-2 py-1 bg-blue-100 hover:bg-blue-200 rounded' }, '✏️'),
                h('button', { onClick:()=>delRecipe(r.id),
                  className:'text-xs px-2 py-1 bg-red-100 hover:bg-red-200 rounded' }, '🗑'))),
            h('div', { className:'mt-2 text-xs text-gray-600 space-y-0.5' },
              r.items.slice(0,5).map((it,i)=>h('div',{key:i},'• ',it.name,' ',fmt(it.target),' ',it.unit,
                h('span',{className:'text-gray-400'},' ±', it.tol>0 ? it.tol : calcTol(toGrams(it.target, it.unit))))),
              r.items.length>5&&h('div',{className:'italic'},'+',r.items.length-5,' รายการ'))))));
}

// ==================== WEIGH TAB ====================
function WeighTab({ state, update, scale, printer, visible }){
  const recipes = state.recipes||[];
  const settings = state.settings||{};
  // 🆕 กู้ชุดที่ชั่งค้างไว้ (refresh/จอดับ/เผลอสลับแท็บ) — ค่าที่ล็อกแล้วอยู่ครบ ตัวที่ยังไม่ล็อกต้องตั้ง 0 ใหม่
  const sess = useMemo(loadSession, []);
  const [recipeId, setRecipeId] = useState(sess && recipes.some(r=>r.id===sess.recipeId) ? sess.recipeId : '');
  const [mult, setMult] = useState(sess && Number(sess.mult)>0 ? Number(sess.mult) : 1);
  const [operator, setOperator] = useState(sess?.operator ?? (settings.lastOperator||''));
  const [note, setNote] = useState(sess?.note || '');
  const [entries, setEntries] = useState(()=>{
    const e = (sess && sess.entries) || {};
    const out = {};
    Object.keys(e).forEach(k=>{ const x=e[k]||{}; out[k] = x.locked ? x : {}; });   // ตัวที่ยังไม่ล็อก → เริ่ม zero-gate ใหม่
    return out;
  });
  const [activeIdx, setActiveIdx] = useState(sess && sess.activeIdx!=null ? sess.activeIdx : null);
  const [toast, setToast] = useState('');
  const [dropNotice, setDropNotice] = useState('');
  const recipe = recipes.find(r=>r.id===recipeId);
  const autoPrint = settings.autoPrint !== false;
  const autoFinish = settings.autoFinish !== false;
  const copies = Number(settings.copies)||1;
  const [countdown, setCountdown] = useState(0);
  const finishedRef = useRef(false);
  const dwellRef = useRef(null);        // { idx, value, since } — กันล็อกค่าตอนยังเทไม่เสร็จ
  const maxSeenRef = useRef(null);      // 🆕 { idx, max } — น้ำหนักสูงสุดที่เห็นหลังตั้ง 0 (จับ TARE/auto-zero กลางคัน)
  const advanceTimerRef = useRef(null);
  const [tick, setTick] = useState(0);  // บังคับ re-check ทุก 400ms แม้เครื่องชั่งหยุดสตรีมค่า

  const showToast = (m) => { setToast(m); setTimeout(()=>setToast(''), 2500); };
  const buzz = (pat) => { try { navigator.vibrate && navigator.vibrate(pat); } catch(e){} };

  // เก็บ session ทุกครั้งที่เปลี่ยน (ไม่มีสูตร = ล้าง)
  useEffect(()=>{
    if(!recipeId){ saveSession(null); return; }
    saveSession({ recipeId, mult, operator, note, entries, activeIdx });
  }, [recipeId, mult, operator, note, entries, activeIdx]);
  // เตือนก่อนปิด/รีเฟรชถ้ามีค่าที่ชั่งไปแล้ว
  const hasAny = Object.values(entries).some(e=>e && e.locked);
  useEffect(()=>{
    if(!hasAny) return;
    const f = (ev)=>{ ev.preventDefault(); ev.returnValue=''; };
    window.addEventListener('beforeunload', f);
    return ()=>window.removeEventListener('beforeunload', f);
  }, [hasAny]);

  // Scaled items — 🆕 หน่วย: kg/L ×1000 · ml/g ×1 · tol: ตามสูตร (×ตัวคูณ) ถ้าไม่ตั้ง → ตาราง calcTol ของ target ที่คูณแล้ว
  //    และไม่ต่ำกว่า minTolG (ค่าเริ่มต้น 1 ก. = ความละเอียดเครื่องชั่งครัวทั่วไป — ±0.5 บนเครื่องก้าว 1 ก. ล็อกไม่ได้เลย)
  const minTolG = Math.max(0, Number(settings.minTolG ?? 1) || 0);
  const items = useMemo(()=> !recipe ? [] : recipe.items.map((it,i)=>{
    const targetG = toGrams(it.target, it.unit) * mult;
    const tolSet = Number(it.tol)||0;
    const tolG = tolSet > 0 ? toGrams(tolSet, it.unit) * mult : calcTol(targetG);
    return { idx:i, name:it.name, target:targetG, tol:Math.max(minTolG, tolG), unit:'g',
      origUnit:it.unit||'g', origTarget:Number(it.target)||0, tolAuto: !(tolSet>0) };
  }), [recipe, mult, minTolG]);

  const zeroTol = Number(settings.zeroTol) || 2;
  const requireZero = settings.requireZero !== false;
  // 🆕 บังคับขั้นต่ำ 1 วิ ในโค้ด (เดิมตั้ง 0 ได้ = จับค่าตอนเทผ่านเกณฑ์แวบเดียว)
  const lockDwellMs = Math.max(1000, (Number(settings.lockDwellSec ?? 2.5)||0) * 1000);
  const STALE_MS = 2500;   // แพ็กเก็ตเก่ากว่านี้ = สัญญาณค้าง ห้ามล็อก

  // ticker
  useEffect(()=>{
    if(activeIdx==null || !scale.connected) return;
    const iv = setInterval(()=>setTick(t=>(t+1)%100000), 400);
    return ()=>clearInterval(iv);
  }, [activeIdx, scale.connected]);

  // 🆕 เปลี่ยนตัวที่ชั่ง — ถ้าตัวเดิมยังไม่ล็อกแต่ผ่านตั้ง 0 ไปแล้ว ต้องล้าง zero-gate (เดิมค้างไว้ → กลับมาเทซ้ำโดยไม่รู้)
  //    ถ้าบนเครื่องยังมีของค้างอยู่ให้ถามก่อน
  const activate = (idx, opts) => {
    if(idx === activeIdx) return;
    const cur = activeIdx!=null ? (entries[activeIdx]||{}) : null;
    if(cur && !cur.locked && cur.zeroOk && !(opts && opts.silent)){
      const live = scale.connected && scale.liveWeight!=null ? Number(scale.liveWeight) : 0;
      if(Math.abs(live) > zeroTol){
        const nm = items.find(x=>x.idx===activeIdx)?.name || '';
        if(!confirm(`"${nm}" เทค้างอยู่บนเครื่อง ${fmt(live)} g ยังไม่ได้ล็อก\n\nจะสลับไปตัวอื่นจริงไหม? (ต้องเอาของออก/ตั้ง 0 ใหม่ก่อนกลับมาชั่ง "${nm}")`)) return;
      }
    }
    if(cur && !cur.locked && cur.zeroOk){
      setEntries(p=>({ ...p, [activeIdx]:{ ...(p[activeIdx]||{}), zeroOk:false } }));
    }
    dwellRef.current = null; maxSeenRef.current = null;
    setActiveIdx(idx);
  };

  // scroll ให้ตัวที่ชั่งอยู่ขึ้นมากลางจอ (จอแท็บเล็ต 8" การ์ดตัวที่ 3 ลงไปอยู่ใต้ fold)
  useEffect(()=>{
    if(activeIdx==null || !visible) return;
    const el = document.getElementById('wcard_'+activeIdx);
    if(el) try { el.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(e){}
  }, [activeIdx, visible]);

  // 🆕 สัญญาณหลุดกลางคัน → ล้าง zero-gate ของตัวที่ชั่งอยู่ + แจ้ง (เครื่องชั่งดับเอง tare หาย = น้ำหนักที่เห็นต่อจากนี้คือทั้งชาม)
  useEffect(()=>{
    scale.onDropRef.current = () => {
      setEntries(p=>{
        if(activeIdx==null) return p;
        const e = p[activeIdx]||{}; if(e.locked || !e.zeroOk) return p;
        return { ...p, [activeIdx]:{ ...e, zeroOk:false } };
      });
      dwellRef.current = null; maxSeenRef.current = null;
      const nm = activeIdx!=null ? (items.find(x=>x.idx===activeIdx)?.name || '') : '';
      setDropNotice(nm ? `เครื่องชั่งหลุดระหว่างชั่ง "${nm}" — เช็คว่าเทไปเท่าไหร่แล้ว ตั้ง 0 ใหม่ก่อนชั่งต่อ` : 'เครื่องชั่งหลุด — กำลังต่อใหม่');
      buzz([60,60,60]);
    };
    return ()=>{ scale.onDropRef.current = null; };
  }, [activeIdx, items]);
  useEffect(()=>{ if(scale.connected && dropNotice) setTimeout(()=>setDropNotice(''), 6000); }, [scale.connected]);

  // Zero-gate: ต้องเห็น 0 นิ่ง ก่อนเริ่มเทตัวนี้ (deps มี tick — เดิมค่า 0 ซ้ำ ๆ ไม่ re-render → ค้างที่ "ตั้ง 0 ก่อน")
  useEffect(()=>{
    if(!requireZero) return;
    if(!scale.connected || activeIdx==null || scale.liveWeight==null) return;
    const e = entries[activeIdx]||{};
    if(e.zeroOk || e.locked) return;
    if(scale.stable && Math.abs(Number(scale.liveWeight)) <= zeroTol && scale.packetAge() < STALE_MS){
      maxSeenRef.current = { idx:activeIdx, max:0 };
      setEntries(p=>({ ...p, [activeIdx]:{ ...(p[activeIdx]||{}), zeroOk:true, zeroLost:false } }));
    }
  }, [scale.stable, scale.liveWeight, activeIdx, requireZero, tick]);

  const nextUnlocked = (afterIdx, ents) =>
    items.find(x=>x.idx>afterIdx && !(ents[x.idx]?.locked)) || items.find(x=>x.idx!==afterIdx && !(ents[x.idx]?.locked)) || null;

  // Auto-lock: นิ่ง + เข้าเกณฑ์ + ผ่าน zero gate + นิ่งค้างครบเวลา + สัญญาณสด → ล็อก + ไปตัวถัดไป
  useEffect(()=>{
    if(!scale.connected){ dwellRef.current=null; return; }
    if(activeIdx==null || scale.liveWeight==null) return;
    const it = items.find(x=>x.idx===activeIdx); if(!it) return;
    const e = entries[activeIdx]||{};
    if(e.locked) return;
    if(requireZero && !e.zeroOk){ dwellRef.current=null; return; }
    const v = Number(scale.liveWeight);
    // 🆕 จำน้ำหนักสูงสุดที่เห็นหลังตั้ง 0 — ถ้าตกกลับเป็น 0 ทั้งที่เทไปแล้ว = มีคนกด TARE/เครื่อง auto-zero กลางคัน
    const ms = maxSeenRef.current;
    if(!ms || ms.idx!==activeIdx) maxSeenRef.current = { idx:activeIdx, max:Math.max(0,v) };
    else if(v > ms.max) ms.max = v;
    if(Math.abs(v) <= zeroTol){
      dwellRef.current=null;
      const seen = maxSeenRef.current ? maxSeenRef.current.max : 0;
      if(requireZero && e.zeroOk && seen > Math.max(10, zeroTol*5)){
        maxSeenRef.current = null;
        setEntries(p=>({ ...p, [activeIdx]:{ ...(p[activeIdx]||{}), zeroOk:false, zeroLost:seen } }));
        buzz([60,60,60]);
      }
      return;
    }
    if(scale.packetAge() > STALE_MS){ dwellRef.current=null; return; }   // สัญญาณค้าง — ค่าที่เห็นอาจไม่ใช่ของจริง
    const inRange = Math.abs(v - it.target) <= it.tol;
    if(!scale.stable || !inRange){ dwellRef.current=null; return; }
    const now = Date.now();
    const d = dwellRef.current;
    if(!d || d.idx!==activeIdx || Math.abs(d.value - v) > 3){
      dwellRef.current = { idx:activeIdx, value:v, since:now };
      return;
    }
    if(Math.abs(v - it.target) < Math.abs(d.value - it.target)) d.value = v;
    if(now - d.since >= lockDwellMs){
      const finalV = d.value;
      dwellRef.current = null; maxSeenRef.current = null;
      setEntries(p=>({ ...p, [activeIdx]:{ ...(p[activeIdx]||{}),
        value:String(finalV), source:'scale', locked:true, lockedAt:Date.now() } }));
      buzz([80]);
      const nxt = nextUnlocked(activeIdx, { ...entries, [activeIdx]:{ locked:true } });
      if(advanceTimerRef.current) clearTimeout(advanceTimerRef.current);
      if(nxt) advanceTimerRef.current = setTimeout(()=>{ advanceTimerRef.current=null; setActiveIdx(nxt.idx); }, 600);
    }
  }, [scale.stable, scale.liveWeight, activeIdx, tick]);

  // 🆕 บันทึกแบบ "นอกเกณฑ์" — ของเหลว/เทเกินแล้วตักออกไม่ได้ ต้องใส่เหตุผล บันทึกค่าจริง ติดธง ⚠️ (เดิมไม่มีทางออก → คนไปขยาย tol ในสูตรหรือไม่บันทึกเลย)
  const lockOffSpec = (it) => {
    if(!scale.connected || scale.liveWeight==null) return;
    if(!scale.stable){ showToast('รอให้เครื่องชั่งนิ่งก่อน'); return; }
    const v = Number(scale.liveWeight);
    const reason = prompt(`บันทึก "${it.name}" = ${fmt(v)} g ทั้งที่เป้า ${fmt(it.target)} ± ${fmt(it.tol)} g\n\nใส่เหตุผล (จำเป็น) — จะติดธง ⚠️ นอกเกณฑ์ ในประวัติและเลข LOT`);
    if(reason == null) return;
    if(!reason.trim()){ showToast('ต้องใส่เหตุผล'); return; }
    dwellRef.current = null; maxSeenRef.current = null;
    setEntries(p=>({ ...p, [it.idx]:{ ...(p[it.idx]||{}), value:String(v), source:'scale', locked:true,
      offSpec:true, reason:reason.trim(), lockedAt:Date.now() } }));
    const nxt = nextUnlocked(it.idx, { ...entries, [it.idx]:{ locked:true } });
    if(nxt) setTimeout(()=>setActiveIdx(nxt.idx), 400);
  };

  const allDone = items.length>0 && items.every(it=>entries[it.idx]?.locked);
  const lockedCount = items.filter(it=>entries[it.idx]?.locked).length;
  const offSpecCount = items.filter(it=>entries[it.idx]?.offSpec).length;
  const totalG = items.reduce((s,it)=>s+(Number(entries[it.idx]?.value)||0),0);

  const labelRotate = !!settings.labelRotate;
  // 🆕 เส้นทางพิมพ์: มีเครื่องพิมพ์ USB ต่ออยู่ → ส่ง TSPL/ESC-POS ตรง · ไม่มี → หน้าจอพิมพ์ของระบบ (คอม/PDF)
  const usbReady = printer && printer.connected;
  const willPrint = usbReady ? (settings.usbAutoPrint !== false) : autoPrint;
  const doPrint = (data) => {
    if(usbReady){
      printer.printLabel(data, settings, copies).catch(e => { showToast('🖨️ พิมพ์ไม่สำเร็จ: ' + e.message); buzz([200]); });
      return true;
    }
    return printHTML(buildLabel(data, copies, labelRotate));
  };

  // 🆕 เลข LOT: ชื่อสูตร-วันที่ท้องถิ่น-ลำดับของวันนี้-รหัสเครื่อง (เดิมใช้วันที่ UTC → ก่อน 7 โมงเช้าเป็นวันเมื่อวาน · 3 หลักท้าย ms สุ่มชนกันได้)
  const genLot = (recipeName, offSpec) => {
    const d = new Date();
    const ymd = String(d.getFullYear()+543).slice(-2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    const todayStr = d.toDateString();
    const n = (state.logs||[]).filter(l => l.recipeName === recipeName && new Date(l.ts).toDateString() === todayStr).length + 1;
    const pre = (recipeName||'WEIGH').replace(/[\s\-_.]+/g,'').slice(0,8).toUpperCase() || 'WEIGH';  // ตัดขีด/ช่องว่างออก ให้ LOT แยกส่วนด้วยขีดได้ชัด
    return `${pre}-${ymd}-${String(n).padStart(2,'0')}${getDeviceId()}${offSpec ? '-X' : ''}`;
  };

  const resetForNext = () => {
    if(advanceTimerRef.current){ clearTimeout(advanceTimerRef.current); advanceTimerRef.current=null; }
    dwellRef.current = null; maxSeenRef.current = null;
    setEntries({}); setCountdown(0); setNote(''); setMult(1);
    setActiveIdx(items.length ? items[0].idx : null);
  };

  const finish = () => {
    if(!allDone) return showToast('ชั่งให้ครบทุกตัวก่อน');
    const resultItems = items.map(it=>{
      const e = entries[it.idx]||{}; const v = Number(e.value)||0;
      return { name:it.name, value:v, unit:'g', target:it.target, tol:it.tol,
        pass: !e.offSpec && Math.abs(v-it.target)<=it.tol,
        ...(e.offSpec ? { offSpec:true, reason:e.reason||'' } : {}) };
    });
    const anyOff = resultItems.some(r=>!r.pass);
    const lot = genLot(recipe.name, anyOff);
    const total = resultItems.reduce((s,r)=>s+r.value,0);
    const data = { recipeName:recipe.name, recipeId:recipe.id, lot, items:resultItems, total, operator, note, ts:Date.now(),
      multiplier: mult, scaleMode: scale.mode, scaleDevice: scale.device?.name||'', deviceId: getDeviceId(),
      ...(anyOff ? { offSpec:true } : {}) };
    update({ logs:[{ ...data, id:'log_'+Date.now().toString(36) }, ...(state.logs||[])].slice(0,LOG_CAP),
      settings:{ ...settings, lastOperator:operator } });
    if(willPrint) doPrint(data);
    resetForNext();
    showToast(willPrint ? `✅ บันทึก ${lot} แล้ว · ส่งพิมพ์ Label${usbReady ? ' (USB)' : ''}` : `✅ บันทึก ${lot} แล้ว`);
    buzz([100,50,100]);
  };

  // Auto-finish countdown
  useEffect(()=>{
    if(allDone && autoFinish && !finishedRef.current){ finishedRef.current = true; setCountdown(3); }
    if(!allDone){ finishedRef.current = false; if(countdown>0) setCountdown(0); }
  }, [allDone, autoFinish]);
  useEffect(()=>{
    if(countdown<=0) return;
    if(countdown===1){ const t = setTimeout(()=>{ setCountdown(0); finish(); }, 1000); return ()=>clearTimeout(t); }
    const t = setTimeout(()=>setCountdown(c=>c-1), 1000);
    return ()=>clearTimeout(t);
  }, [countdown]);
  const cancelAuto = ()=>{ setCountdown(0); };

  const pickRecipe = (id) => {
    if(hasAny && !confirm('มีค่าที่ชั่งไว้แล้วในชุดนี้ — เปลี่ยนสูตรจะล้างทิ้งทั้งหมด ยืนยัน?')) return;
    if(advanceTimerRef.current){ clearTimeout(advanceTimerRef.current); advanceTimerRef.current=null; }
    dwellRef.current = null; maxSeenRef.current = null;
    setRecipeId(id); setEntries({}); setMult(1); setCountdown(0);
    const r = recipes.find(x=>x.id===id);
    setActiveIdx(r && r.items.length ? 0 : null);   // เริ่มที่ตัวแรกเลย ไม่ต้องแตะเพิ่ม
  };
  const pickMult = (m) => {
    if(m === mult) return;
    if(hasAny && !confirm(`เปลี่ยนตัวคูณเป็น ×${m} จะล้างค่าที่ชั่งไว้แล้ว (${lockedCount} ตัว) ยืนยัน?`)) return;
    setEntries({}); setMult(m); setActiveIdx(items.length ? items[0].idx : null);
    dwellRef.current = null; maxSeenRef.current = null;
  };

  const showDebugBtns = !IS_MOBILE || DEBUG;
  const todayLogs = recipe ? (state.logs||[]).filter(l => l.recipeName === recipe.name && new Date(l.ts).toDateString() === new Date().toDateString()) : [];

  return h('div', { className:'space-y-3' },
    toast && h('div', { className:'fixed top-16 left-1/2 -translate-x-1/2 z-30 bg-gray-900 text-white px-4 py-2 rounded-lg shadow-lg text-sm' }, toast),

    // ===== Scale bar =====
    h('div', { className: cls('rounded-lg p-3 border-2',
      scale.connected ? 'bg-green-50 border-green-300' : scale.connecting ? 'bg-blue-50 border-blue-300' : 'bg-gray-50 border-gray-300') },
      !scale.connected && !scale.connecting && h('div', { className:'flex items-center gap-2 flex-wrap' },
        h('button', { onClick:scale.connectBLE,
          className:'flex-1 min-w-[200px] px-4 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-lg text-lg font-bold' },
          '🔵 ต่อเครื่องชั่ง (Bluetooth)'),
        showDebugBtns && [
          h('label', { key:'b', className:'flex items-center gap-1 text-xs' }, 'Baud:',
            h('select', { value:scale.baudRate, onChange:e=>scale.setBaudRate(Number(e.target.value)),
              className:'px-1 py-0.5 border rounded text-xs' },
              [2400,4800,9600,19200,38400,57600,115200].map(b=>h('option',{key:b,value:b},b)))),
          h('button', { key:'s', onClick:()=>scale.connectSerial(scale.baudRate),
            className:'px-2 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded text-xs' }, '🔌 USB-Serial'),
          h('button', { key:'m', onClick:scale.connectMock,
            className:'px-2 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded text-xs' }, '🎭 Mock'),
        ]),

// ==================== LOGS TAB ====================
function LogsTab({ state, printer }){
  const logs = state.logs||[];
  const reprint = (log) => {
    if(printer && printer.connected){ printer.printLabel(log, state.settings, 1).catch(e=>alert('🖨️ พิมพ์ไม่สำเร็จ: '+e.message)); return; }
    printHTML(buildLabel(log, 1, !!state.settings?.labelRotate));
  };
  return h('div', { className:'space-y-2' },
    h('h2', { className:'font-bold text-lg' }, '📜 ประวัติการชั่ง (', logs.length, ')'),
    logs.length===0
      ? h('div', { className:'bg-white rounded-lg shadow p-8 text-center text-gray-500' }, 'ยังไม่มีประวัติ')
      : logs.map(log=>h('div', { key:log.id, className:'bg-white rounded-lg shadow p-3' },
          h('div', { className:'flex justify-between items-start flex-wrap gap-2' },
            h('div', null,
              h('div', { className:'font-bold' }, log.recipeName,
                log.multiplier && log.multiplier!==1 && h('span', { className:'ml-1 text-orange-600' }, '×', log.multiplier),
                h('span', { className:'ml-2 text-xs font-mono bg-gray-100 px-1.5 py-0.5 rounded' }, log.lot),
                log.offSpec && h('span', { className:'ml-1 text-xs bg-orange-500 text-white px-1.5 py-0.5 rounded font-bold' }, '⚠️ นอกเกณฑ์')),
              h('div', { className:'text-xs text-gray-500' },
                new Date(log.ts).toLocaleString('th-TH'), ' · ', log.operator||'-',
                ' · รวม ', fmt(log.total), ' g',
                log.scaleMode ? ' · ' + (log.scaleMode==='mock' ? '🎭 MOCK (ทดสอบ)' : (log.scaleDevice||log.scaleMode)) : '',
                log.note ? ' · ' + log.note : '')),
            h('button', { onClick:()=>reprint(log),
              className:'px-3 py-1.5 bg-blue-100 hover:bg-blue-200 rounded text-sm' }, '🖨️ พิมพ์ซ้ำ', printer && printer.connected ? ' (USB)' : '')),
          h('div', { className:'mt-1 text-xs text-gray-600 flex flex-wrap gap-x-3' },
            log.items.map((it,i)=>h('span',{key:i, className: it.pass?'':'text-orange-600 font-bold', title: it.reason||'' },
              it.name,': ',fmt(it.value),'g',it.pass?'':' ⚠️'+(it.reason?' ('+it.reason+')':'')))))));
}
